name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/relojeria_webapp

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test & Coverage

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -r requirements.txt

    - name: Run tests with coverage
      run: |
        pytest tests/ --cov=app --cov-report=xml --cov-report=term-missing -v --cov-config=.coveragerc

    - name: Check coverage threshold
      run: |
        coverage report --fail-under=40

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  build:
    needs: test
    runs-on: ubuntu-latest
    name: Build & Push Docker Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to EC2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to EC2
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}
        EC2_USER: ubuntu
        EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        IMAGE_NAME: relojeria_webapp
      run: |
        mkdir -p ~/.ssh
        echo "$EC2_PRIVATE_KEY" > ~/.ssh/deploy_key.pem
        chmod 600 ~/.ssh/deploy_key.pem
        ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts 2>/dev/null
        
        ssh -i ~/.ssh/deploy_key.pem $EC2_USER@$EC2_HOST << 'DEPLOY_EOF'
          set -e
          docker pull $DOCKER_USERNAME/$IMAGE_NAME:latest
          docker stop relojeria || true
          docker rm relojeria || true
          docker run -d \
            --name relojeria \
            --restart always \
            -p 80:8000 \
            $DOCKER_USERNAME/$IMAGE_NAME:latest
          sleep 3
          curl -f http://localhost/api/health || exit 1
          echo "✅ Deployment successful!"
        DEPLOY_EOF

    - name: Verify EC2 Deployment
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}
      run: |
        sleep 5
        curl -f http://$EC2_HOST/api/health && echo "✅ API is responding!"
